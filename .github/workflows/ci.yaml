name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality:
    name: Code quality checks
    runs-on: ubuntu-slim
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Zig
        uses: jassielof/setup-zig@main
      - name: Run code quality checks
        run: zig build check --summary all
  build:
    name: Build
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Zig
        uses: jassielof/setup-zig@main
      - name: Build
        run: zig build --summary all
  test:
    name: Test on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Nushell
        uses: hustcer/setup-nu@v3
      - name: Set up Zig
        uses: jassielof/setup-zig@main
      - name: Run tests
        run: zig build test --summary all
  test-doc-gen:
    name: Test documentation generation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Zig
        uses: jassielof/setup-zig@main
      - name: Generate documentation
        run: zig build e2e-docs --summary all
      - name: Install AsciiDoc
        run: sudo gem install asciidoctor
      - name: Build documentation
        run: asciidoctor zig-out/docs/fangz.adoc
  test-completions:
    name: Load ${{ matrix.shell }} completion on ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-slim
            shell: bash
          - os: ubuntu-slim
            shell: zsh
          - os: ubuntu-slim
            shell: fish
          - os: ubuntu-slim
            shell: nu
          - os: ubuntu-slim
            shell: pwsh
          - os: windows-latest
            shell: nu
          - os: windows-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Nushell
        if: matrix.shell == 'nu'
        uses: hustcer/setup-nu@v3
      - name: Set up Zig
        uses: jassielof/setup-zig@main
      - name: Install Zsh
        if: matrix.shell == 'zsh'
        run: |
          sudo apt update
          sudo apt install --yes zsh
      - name: Install Fish
        if: matrix.shell == 'fish'
        run: |
          sudo add-apt-repository ppa:fish-shell/release-4
          sudo apt update
          sudo apt install --yes fish
      - name: Generate end-to-end completion scripts
        run: zig build e2e-completions --summary all
      - name: Load Bash completion
        if: matrix.shell == 'bash'
        run: source zig-out/completions/fangz.bash
      - name: Load Zsh completion
        if: matrix.shell == 'zsh'
        run: zsh -fc 'function compdef { :; }; source zig-out/completions/fangz.zsh'
      - name: Load Fish completion
        if: matrix.shell == 'fish'
        run: fish -c 'source zig-out/completions/fangz.fish'
      - name: Load Nushell completion
        if: matrix.shell == 'nu'
        shell: nu {0}
        run: source zig-out/completions/fangz.nu
      - name: Load PowerShell completion
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: . ./zig-out/completions/fangz.ps1
  docs:
    runs-on: ubuntu-latest
    needs: test
    name: Build documentation
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Zig
        uses: jassielof/setup-zig@main
      - name: Build documentation
        run: zig build docs --summary all
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: zig-out/docs
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: docs
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployment
        id: deployment
        uses: actions/deploy-pages@v5
